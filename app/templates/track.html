{% extends "base.html" %}
{% block title %}– Gleisplan{% endblock %}
{% block nav_track %}active{% endblock %}

{% block content %}
<style>
  /* Gleisplan-spezifische Optimierungen (nur auf dieser Seite) */
  :root {
    --canvas-bg:   #f8f6ff;
    --grid-line:   #e0d8fb;
    --grid-major:  #cebff8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas-bg:  #0f0d1a;
      --grid-line:  #211c33;
      --grid-major: #2c2547;
    }
  }

  /* Katalog */
  .cat-group-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-muted); font-weight: 700; margin: 1rem 0 .5rem; }
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: .5rem; }
  .cat-item { display: flex; flex-direction: column; align-items: center; gap: .35rem;
    padding: .5rem .3rem; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); cursor: pointer; transition: border-color .12s, background .12s; }
  .cat-item:hover { border-color: var(--primary); background: var(--primary-light); }
  .cat-preview { width: 46px; height: 46px; background: #0f0d1a; border-radius: 6px; }
  .cat-item span { font-size: 11px; text-align: center; color: var(--text); line-height: 1.15; }

  .track-workspace {
    height: calc(100vh - 168px);
    min-height: 480px;
  }

  .track-canvas-wrap {
    position: relative;
    overflow: hidden;               /* Navigation läuft über viewBox, nicht Scrollbars */
    background: var(--canvas-bg);
    cursor: crosshair;
  }
  .track-canvas-wrap.pan-mode { cursor: grab; }
  .track-canvas-wrap.panning  { cursor: grabbing; }

  #track-canvas {
    display: block;
    width: 100%;
    height: 100%;
    min-width: 0;                   /* alte min-width:800px überschreiben */
  }

  /* Schwebende Navigations-Steuerung unten rechts auf der Leinwand */
  .canvas-nav {
    position: absolute;
    right: .75rem;
    bottom: .75rem;
    display: flex;
    align-items: center;
    gap: .25rem;
    padding: .3rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(30,27,46,.18);
  }
  .canvas-nav button {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px;
    background: transparent; color: var(--text);
    font-size: 1rem; cursor: pointer;
    transition: background .12s;
  }
  .canvas-nav button:hover { background: var(--primary-light); color: var(--primary); }
  .canvas-nav .zoom-label {
    min-width: 46px; text-align: center;
    font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--text-muted); user-select: none;
  }
  .canvas-nav .nav-sep { width: 1px; height: 20px; background: var(--border); margin: 0 .15rem; }

  /* Element-Zähler / leerer Zustand oben links */
  .canvas-hint {
    position: absolute;
    left: .75rem; top: .75rem;
    font-size: 12px; color: var(--text-muted);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: .3rem .6rem;
    pointer-events: none;
    max-width: 240px;
  }
  .canvas-hint strong { color: var(--primary); }

  .zoom-tool { font-weight: 700; }
</style>

<div class="page-header">
  <h1>Gleisplan</h1>
  <div class="track-toolbar">
    <button class="btn btn-sm btn-primary" onclick="openCatalog()">＋ Katalog</button>
    <span class="toolbar-label">Element: <strong id="cur-tool-name">Gerade</strong></span>
    <span class="toolbar-sep"></span>
    <button class="tool-btn active" data-type="straight" onclick="selectTool('straight', this)" title="Gerade">━</button>
    <button class="tool-btn" data-type="curve" onclick="selectTool('curve', this)" title="Kurve">╭</button>
    <button class="tool-btn" data-type="turnout_r" onclick="selectTool('turnout_r', this)" title="Weiche rechts">⑂</button>
    <button class="tool-btn" data-type="label" onclick="selectTool('label', this)" title="Beschriftung">T</button>
    <span class="toolbar-sep"></span>
    <button class="tool-btn" data-type="pan" onclick="selectTool('pan', this)" title="Verschieben (Leertaste halten + ziehen)">✋</button>
    <button class="tool-btn" onclick="rotateSelected()" title="Drehen (R)">↻</button>
    <button class="tool-btn" onclick="deleteSelected()" title="Löschen (Entf)">🗑</button>
    <span class="toolbar-sep"></span>
    <button class="btn btn-sm btn-ghost" onclick="clearTrack()">Leeren</button>
  </div>
</div>

<!-- Katalog: alle Z21-Komponenten zum Setzen -->
<div id="catalog-modal" class="modal hidden">
  <div class="modal-box" style="width:660px;max-width:94vw">
    <h2>Objekt auswählen</h2>
    <div id="catalog-body" style="max-height:64vh;overflow-y:auto"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeCatalog()">Schließen</button>
    </div>
  </div>
</div>

<div class="track-workspace">
  <div class="track-canvas-wrap">
    <svg id="track-canvas" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 2000 1300" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--grid-line)" stroke-width="1"/>
        </pattern>
        <pattern id="grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
          <rect width="200" height="200" fill="url(#grid)"/>
          <path d="M 200 0 L 0 0 0 200" fill="none" stroke="var(--grid-major)" stroke-width="1.5"/>
        </pattern>
      </defs>
      <rect id="backdrop" x="-6000" y="-6000" width="16000" height="16000" fill="var(--canvas-bg)"/>
      <rect id="gridrect" x="-6000" y="-6000" width="16000" height="16000" fill="url(#grid-major)"/>
      <g id="track-elements"></g>
    </svg>

    <div class="canvas-hint" id="canvas-hint"></div>

    <div class="canvas-nav">
      <button onclick="zoomBy(1/1.25)" title="Verkleinern">−</button>
      <span class="zoom-label" id="zoom-label">100 %</span>
      <button onclick="zoomBy(1.25)" title="Vergrößern">+</button>
      <span class="nav-sep"></span>
      <button onclick="fitToContent()" title="Einpassen (F)">⤢</button>
    </div>
  </div>

  <!-- Eigenschaften-Panel -->
  <div class="track-props">
    <div class="props-header">Eigenschaften</div>
    <div id="props-content">
      <p class="muted" style="padding:.75rem">Element anklicken zum Bearbeiten.</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const GRID = 40;
const MIN_VIEW_W = 400;     // stärkste Vergrößerung
const MAX_VIEW_W = 8000;    // stärkste Verkleinerung
const DEFAULT_VIEW = { x: 0, y: 0, w: 2000, h: 1300 };

let currentTool = 'straight';
let selectedId  = null;
let elements    = [];
let turnoutStates = {};

let view = { ...DEFAULT_VIEW };

// Pan-/Drag-Zustand
let isPanning = false;
let spaceDown = false;
let dragStart = null;
let movedWhilePanning = false;

const svgEl  = () => document.getElementById('track-canvas');
const wrapEl = () => document.querySelector('.track-canvas-wrap');

// ── Ansicht (viewBox) ─────────────────────────

function applyView() {
  const s = svgEl();
  s.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  const scale = (s.clientWidth || 1) / view.w;
  const label = document.getElementById('zoom-label');
  if (label) label.textContent = Math.round(scale * 100) + ' %';
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function screenToWorld(clientX, clientY) {
  const s = svgEl();
  const pt = s.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(s.getScreenCTM().inverse());
}

function zoomAt(clientX, clientY, factor) {
  const world = screenToWorld(clientX, clientY);
  const newW  = clamp(view.w / factor, MIN_VIEW_W, MAX_VIEW_W);
  const ratio = newW / view.w;
  view.x = world.x - (world.x - view.x) * ratio;
  view.y = world.y - (world.y - view.y) * ratio;
  view.w = newW;
  view.h = view.h * ratio;
  applyView();
}

function zoomBy(factor) {
  const r = wrapEl().getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor);
}

function fitToContent() {
  const s = svgEl();
  const cw = s.clientWidth  || 1000;
  const ch = s.clientHeight || 600;
  const ar = cw / ch;

  if (elements.length === 0) {
    view = { x: 0, y: 0, w: DEFAULT_VIEW.h * ar, h: DEFAULT_VIEW.h };
    applyView();
    return;
  }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const el of elements) {
    minX = Math.min(minX, el.x);
    minY = Math.min(minY, el.y);
    maxX = Math.max(maxX, el.x + GRID);
    maxY = Math.max(maxY, el.y + GRID);
  }
  const pad = GRID * 2;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;

  const boxW = maxX - minX, boxH = maxY - minY;
  let w, h;
  if (boxW / boxH > ar) { w = boxW; h = boxW / ar; }
  else                  { h = boxH; w = boxH * ar; }

  view = { x: minX - (w - boxW) / 2, y: minY - (h - boxH) / 2, w, h };
  applyView();
}

function updateHint() {
  const hint = document.getElementById('canvas-hint');
  if (!hint) return;
  if (elements.length === 0) {
    hint.innerHTML = 'Leer. Werkzeug wählen und auf die Leinwand klicken.';
  } else {
    hint.innerHTML = `<strong>${elements.length}</strong> Elemente · Scrollen = Zoom · Leertaste + ziehen = verschieben`;
  }
}

// ── Laden ─────────────────────────────────────

async function loadTrack() {
  elements = await fetch('/api/track/').then(r => r.json());
  const turnouts = await fetch('/api/turnouts/').then(r => r.json());
  turnouts.forEach(t => { turnoutStates[t.address] = t.thrown; });
  renderAll();
  updateHint();
  fitToContent();   // beim Öffnen automatisch auf den Plan einpassen
}

// ── Rendern ───────────────────────────────────

function renderAll() {
  const g = document.getElementById('track-elements');
  g.innerHTML = '';
  elements.forEach(el => g.appendChild(makeElement(el)));
}

function makeElement(el) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `translate(${el.x + GRID/2}, ${el.y + GRID/2}) rotate(${el.rotation})`);
  g.setAttribute('data-id', el.id);
  g.setAttribute('cursor', 'pointer');

  if (selectedId === el.id) {
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', -GRID/2 - 4); bg.setAttribute('y', -GRID/2 - 4);
    bg.setAttribute('width', GRID + 8); bg.setAttribute('height', GRID + 8);
    bg.setAttribute('rx', '6');
    bg.setAttribute('fill', '#7c3aed'); bg.setAttribute('fill-opacity', '0.15');
    bg.setAttribute('stroke', '#7c3aed'); bg.setAttribute('stroke-width', '1.5');
    bg.setAttribute('stroke-dasharray', '4 2');
    g.appendChild(bg);
  }

  g.innerHTML += getElementSVG(el);
  g.addEventListener('click', (e) => { e.stopPropagation(); selectElement(el.id); });
  return g;
}

function getElementSVG(el) {
  const t = el.element_type;
  const hs = GRID / 2;

  // Schema-Farben: ruhige, einfarbige Gleise; Zustand nur bei Weichen farbig.
  const TRACK     = '#b9a9ec';   // Gleis
  const TRACK_DIM = '#574d80';   // inaktive Weichenroute
  const AMBER     = '#f5a524';   // Abzweig gestellt
  const W = 3;                    // Linienstärke
  const hit = `<rect x="${-hs}" y="${-hs}" width="${GRID}" height="${GRID}" fill="transparent" pointer-events="all"/>`;

  // Diagonalstücke (45°/135°) müssen bis in die Zellecken reichen, sonst klaffen
  // in schrägen Gleisläufen Lücken (diagonale Nachbarn liegen √2× weiter weg).
  const diag = (el.rotation % 90) !== 0;
  const L = diag ? hs * Math.SQRT2 : hs;
  const dl = hs * Math.SQRT2;    // feste Diagonallänge (für Kreuzungsweichen-Schräge)
  const TUNNEL = '#4e4a70';       // Tunnel-Band (breiter, grau)

  // Tunnel: breites Band mit Gleis darin (type 39 der Z21)
  if (t === 'tunnel') {
    return `${hit}
      <line x1="${-L}" y1="0" x2="${L}" y2="0" stroke="${TUNNEL}" stroke-width="13" stroke-linecap="round"/>
      <line x1="${-L}" y1="0" x2="${L}" y2="0" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>`;
  }
  if (t === 'tunnel_curve') {
    return `${hit}
      <path d="M ${-hs} 0 Q 0 0 0 ${-hs}" fill="none" stroke="${TUNNEL}" stroke-width="13" stroke-linecap="round"/>
      <path d="M ${-hs} 0 Q 0 0 0 ${-hs}" fill="none" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>`;
  }

  if (t === 'straight') {
    return `${hit}<line x1="${-L}" y1="0" x2="${L}" y2="0" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>`;
  }
  if (t === 'curve') {
    return `${hit}<path d="M ${-hs} 0 Q 0 0 0 ${-hs}" fill="none" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>`;
  }
  // Weite Kurve: sanfter Übergang von einer Kardinal-Kante in eine Diagonal-Ecke,
  // damit sie bündig an die Diagonale anschließt.
  if (t === 'wide_curve') {
    const CARD = {N:[0,-hs], E:[hs,0], S:[0,hs], W:[-hs,0]};
    const CORNER = {NE:[hs,-hs], SE:[hs,hs], SW:[-hs,hs], NW:[-hs,-hs]};
    const p = el.properties || {};
    const c = CARD[p.from] || [-hs,0];
    const d = CORNER[p.to] || [hs,-hs];
    return `${hit}<path d="M ${c[0]} ${c[1]} Q 0 0 ${d[0]} ${d[1]}" fill="none" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>`;
  }
  // Brücke: Gleis mit grünen Trägern (Seitenschienen + Kreuze)
  if (t === 'bridge') {
    return `${hit}
      <line x1="${-L}" y1="-7" x2="${L}" y2="-7" stroke="#2f9e6a" stroke-width="2"/>
      <line x1="${-L}" y1="7"  x2="${L}" y2="7"  stroke="#2f9e6a" stroke-width="2"/>
      <path d="M ${-hs} -7 L ${-hs/2} 7 M ${-hs/2} -7 L 0 7 M 0 -7 L ${hs/2} 7 M ${hs/2} -7 L ${hs} 7" stroke="#2f9e6a" stroke-width="1.5" fill="none" opacity="0.8"/>
      <line x1="${-L}" y1="0" x2="${L}" y2="0" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>`;
  }
  // Bahnübergang: Gleis kreuzt eine Straße (grauer Querbalken + rote Marken)
  if (t === 'level_crossing') {
    return `${hit}
      <rect x="-7" y="${-hs}" width="14" height="${GRID}" fill="#3a3852" fill-opacity="0.7"/>
      <line x1="${-L}" y1="0" x2="${L}" y2="0" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>
      <path d="M -5 ${-hs+3} l 4 4 M -1 ${-hs+3} l -4 4" stroke="#ef4444" stroke-width="1.5"/>
      <path d="M 5 ${hs-3} l -4 -4 M 1 ${hs-3} l 4 -4" stroke="#ef4444" stroke-width="1.5"/>`;
  }
  // Kreuzung: ein Gleis als Brücke oben (durchgezogen + Deck), das andere unten (mit Lücke).
  // axes = Kreuzungsachsen (0=waag,90=senk,45=\,135=/); over = welche Achse oben liegt.
  if (t === 'cross') {
    const axes = (el.properties && el.properties.axes) || [0, 90];
    const endpts = o => o === 0   ? [[-hs, 0], [hs, 0]]
                      : o === 90  ? [[0, -hs], [0, hs]]
                      : o === 45  ? [[-hs, -hs], [hs, hs]]
                      :             [[hs, -hs], [-hs, hs]];
    if (axes.length < 2) {
      const [a, b] = endpts(axes[0] ?? 0);
      return `${hit}<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>`;
    }
    let over = (el.properties && el.properties.over != null) ? el.properties.over
             : (axes.find(o => o === 45 || o === 135));
    if (over == null) over = axes[1];
    const under = axes.find(o => o !== over);

    const [[ux1, uy1], [ux2, uy2]] = endpts(under);
    const uL = Math.hypot(ux2 - ux1, uy2 - uy1), udx = (ux2 - ux1) / uL, udy = (uy2 - uy1) / uL;
    const g = 7;  // Lücke am Kreuzungspunkt (Unterführung)
    const underSvg =
      `<line x1="${ux1}" y1="${uy1}" x2="${(-udx*g).toFixed(1)}" y2="${(-udy*g).toFixed(1)}" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>
       <line x1="${(udx*g).toFixed(1)}" y1="${(udy*g).toFixed(1)}" x2="${ux2}" y2="${uy2}" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>`;

    const [[ox1, oy1], [ox2, oy2]] = endpts(over);
    const oL = Math.hypot(ox2 - ox1, oy2 - oy1), odx = (ox2 - ox1) / oL, ody = (oy2 - oy1) / oL;
    const px = -ody, py = odx, h = g + 4, off = 6.5;
    const rail = s =>
      `<line x1="${(odx*-h + px*s*off).toFixed(1)}" y1="${(ody*-h + py*s*off).toFixed(1)}" x2="${(odx*h + px*s*off).toFixed(1)}" y2="${(ody*h + py*s*off).toFixed(1)}" stroke="#d9ccff" stroke-width="2.2" stroke-linecap="round"/>`;
    // kleine Widerlager-Striche quer am Ende der Unterführungslücke
    const abut = sgn =>
      `<line x1="${(udx*g*sgn + (-udy)*4).toFixed(1)}" y1="${(udy*g*sgn + (udx)*4).toFixed(1)}" x2="${(udx*g*sgn - (-udy)*4).toFixed(1)}" y2="${(udy*g*sgn - (udx)*4).toFixed(1)}" stroke="${TRACK_DIM}" stroke-width="1.5" stroke-linecap="round"/>`;
    const overSvg =
      abut(1) + abut(-1) + rail(1) + rail(-1) +
      `<line x1="${ox1}" y1="${oy1}" x2="${ox2}" y2="${oy2}" stroke="${TRACK}" stroke-width="${W + 1}" stroke-linecap="round"/>`;

    return `${hit}${underSvg}${overSvg}`;
  }
  // Prellbock / Gleisende: Stummel + Endbalken
  if (t === 'bumper' || t === 'track_end') {
    return `${hit}
      <line x1="0" y1="${L}" x2="0" y2="-3" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>
      <line x1="-6" y1="-3" x2="6" y2="-3" stroke="#ef6a6a" stroke-width="3" stroke-linecap="round"/>`;
  }
  // Y-Weiche / Dreiwegweiche: symmetrische Abzweige
  if (t === 'y_turnout' || t === 'three_way') {
    const thrown = turnoutStates[el.ref_address] || false;
    const c1 = thrown ? AMBER : TRACK;
    const stem   = `<line x1="0" y1="${L}" x2="0" y2="0" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>`;
    const left   = `<line x1="0" y1="0" x2="${-hs}" y2="${-hs}" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>`;
    const right  = `<line x1="0" y1="0" x2="${hs}" y2="${-hs}" stroke="${c1}" stroke-width="${W}" stroke-linecap="round"/>`;
    const mid    = t === 'three_way' ? `<line x1="0" y1="0" x2="0" y2="${-L}" stroke="${TRACK}" stroke-width="${W}" stroke-linecap="round"/>` : '';
    const badge = el.ref_address
      ? `<text x="${hs-1}" y="${hs-2}" text-anchor="end" font-size="8" font-weight="700" fill="#e8b64d" paint-order="stroke" stroke="#12101c" stroke-width="2.5">${el.ref_address}</text>` : '';
    return `${hit}${stem}${mid}${left}${right}${badge}`;
  }
  // Weichen-Familie: durchgehende Route senkrecht (bei rotation 0), Abzweig je Typ.
  // Die aktuell gestellte Route wird hervorgehoben (gerade = Gleisfarbe, abbiegen = orange).
  if (t === 'turnout' || t === 'turnout_r' || t === 'turnout_l' || t === 'slip' || t === 'dkw') {
    const thrown = turnoutStates[el.ref_address] || false;
    const throughColor = thrown ? TRACK_DIM : TRACK;      // gerade
    const branchColor  = thrown ? AMBER     : TRACK_DIM;  // abbiegen
    const through = `<line x1="0" y1="${-L}" x2="0" y2="${L}" stroke="${throughColor}" stroke-width="${W}" stroke-linecap="round"/>`;
    let branch;
    if (t === 'turnout_l')              branch = `<line x1="0" y1="1" x2="${-hs}" y2="${-hs}" stroke="${branchColor}" stroke-width="${W}" stroke-linecap="round"/>`;
    else if (t === 'slip' || t === 'dkw') branch = `<line x1="${-dl}" y1="${-dl}" x2="${dl}" y2="${dl}" stroke="${branchColor}" stroke-width="${W}" stroke-linecap="round"/>`;
    else                               branch = `<line x1="0" y1="1" x2="${hs}" y2="${-hs}" stroke="${branchColor}" stroke-width="${W}" stroke-linecap="round"/>`;
    const badge = el.ref_address
      ? `<text x="${hs-1}" y="${hs-2}" text-anchor="end" font-size="8" font-weight="700" fill="#e8b64d" paint-order="stroke" stroke="#12101c" stroke-width="2.5">${el.ref_address}</text>`
      : `<circle cx="${hs-4}" cy="${-hs+4}" r="2.5" fill="#ef4444"/>`;
    return `${hit}${branch}${through}${badge}`;
  }
  // Belegtmelder: dezentes grünes Overlay auf dem Gleisabschnitt
  if (t === 'detector') {
    return `${hit}
      <rect x="${-hs}" y="-6" width="${GRID}" height="12" rx="3" fill="#22c55e" fill-opacity="0.16"/>
      <rect x="${-hs}" y="-6" width="${GRID}" height="12" rx="3" fill="none" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>`;
  }
  if (t === 'signal') {
    return `${hit}
      <line x1="0" y1="${hs}" x2="0" y2="2" stroke="${TRACK_DIM}" stroke-width="2"/>
      <circle cx="0" cy="-3" r="4.5" fill="#22c55e" stroke="#0c2a16" stroke-width="1"/>
      ${el.ref_address ? `<text x="0" y="${hs-1}" text-anchor="middle" font-size="8" font-weight="700" fill="#a78bfa" paint-order="stroke" stroke="#12101c" stroke-width="2.5">${el.ref_address}</text>` : ''}`;
  }
  if (t === 'block') {
    const lbl = el.label || 'Block';
    return `
      <rect x="${-hs+2}" y="-9" width="${GRID-4}" height="18" fill="none" stroke="#a78bfa" stroke-width="2" rx="4"/>
      <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="700" fill="#c4b5f0">${lbl}</text>`;
  }
  if (t === 'label') {
    const props = el.properties || {};
    const fs = Math.max(8, Math.min(15, (props.font_size || 24) * 0.42));
    const lines = String(el.label || 'Text').split('\n');
    const lh = fs * 1.15;
    const y0 = -(lines.length - 1) * lh / 2 + fs * 0.34;
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const tspans = lines.map((ln, i) =>
      `<tspan x="0" y="${(y0 + i * lh).toFixed(1)}">${esc(ln)}</tspan>`).join('');
    return `<text text-anchor="middle" font-size="${fs.toFixed(1)}" font-weight="600" fill="#d8d2ee" paint-order="stroke" stroke="#12101c" stroke-width="3">${tspans}</text>`;
  }
  return `${hit}<line x1="${-L}" y1="0" x2="${L}" y2="0" stroke="${TRACK_DIM}" stroke-width="${W}" stroke-linecap="round" stroke-dasharray="3 3"/>`;
}

// ── Navigation: Zoom (Rad) + Pan (Leertaste/Mitteltaste/Pan-Werkzeug) ──

function onWheel(e) {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  zoomAt(e.clientX, e.clientY, factor);
}

function onPointerDown(e) {
  const wantPan = (e.button === 1) || spaceDown || currentTool === 'pan';
  if (wantPan && e.button !== 2) {
    isPanning = true;
    movedWhilePanning = false;
    dragStart = { x: e.clientX, y: e.clientY };
    wrapEl().classList.add('panning');
    e.preventDefault();
  }
}

function onPointerMove(e) {
  if (!isPanning) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) movedWhilePanning = true;
  const s = svgEl();
  view.x -= dx * (view.w / (s.clientWidth  || 1));
  view.y -= dy * (view.h / (s.clientHeight || 1));
  dragStart = { x: e.clientX, y: e.clientY };
  applyView();
}

function onPointerUp() {
  if (isPanning) {
    isPanning = false;
    wrapEl().classList.remove('panning');
  }
}

// ── Klick auf Leinwand → Element setzen ───────

function onCanvasClick(e) {
  if (currentTool === 'pan' || spaceDown) return;
  if (movedWhilePanning) { movedWhilePanning = false; return; }
  if (e.target.closest('[data-id]')) return;   // Element angeklickt → Selektion
  selectElement(null);
  const w = screenToWorld(e.clientX, e.clientY);
  const x = Math.floor(w.x / GRID) * GRID;
  const y = Math.floor(w.y / GRID) * GRID;
  placeElement(currentTool, x, y);
}

function onCanvasRightClick(e) {
  e.preventDefault();
  rotateSelected();
}

const SWITCHABLE = ['turnout','turnout_r','turnout_l','y_turnout','three_way','slip','dkw'];

async function placeElement(type, x, y) {
  let label = '';
  if (type === 'label') label = prompt('Beschriftung:', '') || 'Text';
  else if (type === 'block') label = prompt('Block-Text:', 'Block') || 'Block';

  let ref_address = null;
  if (SWITCHABLE.includes(type) || type === 'signal') {
    const what = type === 'signal' ? 'Signal' : 'Weiche';
    const inp = prompt(`DCC-Adresse für ${what} (1–2044):`, '1');
    ref_address = inp ? parseInt(inp) || null : null;
  } else if (type === 'detector') {
    const inp = prompt('Melder-Adresse:', '1');
    ref_address = inp ? parseInt(inp) || null : null;
  }

  const properties = type === 'label' ? {font_size: 24} : {};
  const res = await fetch('/api/track/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({element_type: type, x, y, rotation: 0, ref_address, label, properties})
  });
  const el = await res.json();
  elements.push(el);
  renderAll();
  updateHint();
  selectElement(el.id);
}

// ── Selektion & Properties ────────────────────

function selectElement(id) {
  selectedId = id;
  renderAll();
  showProps(id);
}

function showProps(id) {
  const el = elements.find(e => e.id === id);
  const panel = document.getElementById('props-content');
  if (!el) {
    panel.innerHTML = '<p class="muted" style="padding:.75rem">Element anklicken zum Bearbeiten.</p>';
    return;
  }

  const typeLabels = {straight:'Gerades Gleis', curve:'Kurve', wide_curve:'Kurve (weit)',
    tunnel:'Tunnel', tunnel_curve:'Tunnelkurve', bridge:'Brücke', cross:'Kreuzung',
    level_crossing:'Bahnübergang', bumper:'Prellbock', track_end:'Gleisende',
    turnout:'Weiche', turnout_r:'Weiche (rechts)', turnout_l:'Weiche (links)',
    y_turnout:'Y-Weiche', three_way:'Dreiwegweiche', slip:'Kreuzungsweiche',
    dkw:'Doppelkreuzungsweiche', signal:'Signal', block:'Block',
    label:'Beschriftung', detector:'Belegtmelder'};
  const isTurnout = ['turnout','turnout_r','turnout_l','y_turnout','three_way','slip','dkw'].includes(el.element_type);

  panel.innerHTML = `
    <div class="prop-section">
      <div class="prop-type-badge">${typeLabels[el.element_type] || el.element_type}</div>

      <div class="prop-row">
        <span class="prop-label">Rotation</span>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          ${[0,45,90,135,180,225,270,315].map(r =>
            `<button class="rot-btn ${el.rotation===r?'rot-active':''}" onclick="setRotation(${el.id},${r})">${r}°</button>`
          ).join('')}
        </div>
      </div>

      ${isTurnout || el.element_type === 'signal' ? `
      <div class="prop-row">
        <span class="prop-label">DCC-Adresse</span>
        <div style="display:flex;gap:.4rem;align-items:center">
          <input type="number" id="prop-addr-${el.id}" value="${el.ref_address || ''}"
                 min="1" max="2044" placeholder="1–2044"
                 style="width:90px">
          <button class="btn btn-sm btn-primary" onclick="saveAddr(${el.id})">Speichern</button>
        </div>
      </div>` : ''}

      ${el.element_type === 'block' || el.element_type === 'label' ? `
      <div class="prop-row">
        <span class="prop-label">Beschriftung</span>
        <div style="display:flex;gap:.4rem;align-items:center">
          <input type="text" id="prop-label-${el.id}" value="${el.label || ''}" placeholder="Text">
          <button class="btn btn-sm btn-primary" onclick="saveLabel(${el.id})">OK</button>
        </div>
      </div>` : ''}

      <div class="prop-actions">
        <button class="btn btn-sm btn-ghost" onclick="rotateSelected()">↻ Drehen</button>
        <button class="btn btn-sm btn-danger" onclick="deleteSelected()">Löschen</button>
      </div>
    </div>

    ${isTurnout && el.ref_address ? `
    <div class="prop-section" style="border-top:1px solid var(--border)">
      <div class="prop-label" style="margin-bottom:.6rem">Weiche ${el.ref_address} stellen</div>
      <div style="display:flex;gap:.5rem">
        <button class="btn btn-success" style="flex:1" onclick="controlTurnout(${el.ref_address},false)">━ Gerade</button>
        <button class="btn btn-warning" style="flex:1" onclick="controlTurnout(${el.ref_address},true)">⑂ Abbiegen</button>
      </div>
      <div class="prop-turnout-state" id="turnout-state-${el.ref_address}">
        Status: <strong>${turnoutStates[el.ref_address] ? 'Abbiegen' : 'Gerade'}</strong>
      </div>
    </div>` : ''}

    ${el.element_type === 'cross' && (el.properties?.axes?.length === 2) ? `
    <div class="prop-section" style="border-top:1px solid var(--border)">
      <div class="prop-label" style="margin-bottom:.6rem">Überwerfung</div>
      <button class="btn btn-sm btn-ghost" style="width:100%" onclick="flipBridge(${el.id})">↕ Brücke tauschen (oben/unten)</button>
    </div>` : ''}
  `;
}

async function flipBridge(id) {
  const el = elements.find(e => e.id === id);
  if (!el || !el.properties || !el.properties.axes || el.properties.axes.length !== 2) return;
  const [a, b] = el.properties.axes;
  const cur = (el.properties.over != null) ? el.properties.over
            : (el.properties.axes.find(o => o === 45 || o === 135) ?? b);
  el.properties.over = (cur === a) ? b : a;
  await fetch(`/api/track/${id}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({properties: el.properties})
  });
  renderAll(); showProps(id);
}

async function setRotation(id, rotation) {
  const el = elements.find(e => e.id === id);
  if (!el) return;
  el.rotation = rotation;
  await fetch(`/api/track/${id}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({rotation})
  });
  renderAll(); showProps(id);
}

async function saveAddr(id) {
  const inp = document.getElementById(`prop-addr-${id}`);
  const value = parseInt(inp.value) || null;
  await updateProp(id, 'ref_address', value);
}

async function saveLabel(id) {
  const inp = document.getElementById(`prop-label-${id}`);
  await updateProp(id, 'label', inp.value);
}

async function updateProp(id, key, value) {
  const el = elements.find(e => e.id === id);
  if (!el) return;
  el[key] = value;
  await fetch(`/api/track/${id}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({[key]: value})
  });
  renderAll(); showProps(id);
}

// ── Aktionen ──────────────────────────────────

async function rotateSelected() {
  if (!selectedId) return;
  const el = elements.find(e => e.id === selectedId);
  if (!el) return;
  el.rotation = (el.rotation + 45) % 360;
  await fetch(`/api/track/${selectedId}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({rotation: el.rotation})
  });
  renderAll(); showProps(selectedId);
}

async function deleteSelected() {
  if (!selectedId) return;
  if (!confirm('Element löschen?')) return;
  await fetch(`/api/track/${selectedId}`, {method:'DELETE'});
  elements = elements.filter(e => e.id !== selectedId);
  selectedId = null;
  renderAll(); showProps(null); updateHint();
}

async function clearTrack() {
  if (!confirm('Gesamten Gleisplan löschen?')) return;
  await fetch('/api/track/', {method:'DELETE'});
  elements = []; renderAll(); showProps(null); updateHint();
}

async function controlTurnout(address, thrown) {
  await fetch(`/api/turnouts/${address}/set`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({thrown})
  });
}

const TYPE_NAMES = {
  straight:'Gerade', curve:'Kurve', wide_curve:'Kurve weit', tunnel:'Tunnel',
  tunnel_curve:'Tunnelkurve', bridge:'Brücke', cross:'Kreuzung',
  level_crossing:'Bahnübergang', bumper:'Prellbock', track_end:'Gleisende',
  turnout_r:'Weiche rechts', turnout_l:'Weiche links', y_turnout:'Y-Weiche',
  three_way:'Dreiwegweiche', slip:'Kreuzungsweiche', dkw:'Doppelkreuzungsweiche',
  signal:'Signal', detector:'Belegtmelder', block:'Block', label:'Beschriftung', pan:'Verschieben'
};

function selectTool(type, btn) {
  currentTool = type;
  document.querySelectorAll('.tool-btn[data-type]').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  wrapEl().classList.toggle('pan-mode', type === 'pan');
  const lbl = document.getElementById('cur-tool-name');
  if (lbl && TYPE_NAMES[type]) lbl.textContent = TYPE_NAMES[type];
}

// ── Katalog: alle Komponenten setzen ──────────

const CATALOG = [
  ['Gleise', ['straight','curve','wide_curve','tunnel','tunnel_curve','bridge','cross','level_crossing','track_end']],
  ['Weichen', ['turnout_r','turnout_l','y_turnout','three_way','slip','dkw']],
  ['Signale & Melder', ['signal','detector']],
  ['Beschriftung', ['block','label']],
];

function buildCatalog() {
  const body = document.getElementById('catalog-body');
  body.innerHTML = CATALOG.map(([grp, items]) => `
    <div class="cat-group-title">${grp}</div>
    <div class="cat-grid">
      ${items.map(type => {
        const demo = {element_type: type, rotation: 0, ref_address: 1, label: TYPE_NAMES[type] || type, properties: {font_size: 20}};
        return `<div class="cat-item" onclick="pickTool('${type}')">
          <svg class="cat-preview" viewBox="-24 -24 48 48">${getElementSVG(demo)}</svg>
          <span>${TYPE_NAMES[type] || type}</span>
        </div>`;
      }).join('')}
    </div>`).join('');
}

function openCatalog()  { buildCatalog(); document.getElementById('catalog-modal').classList.remove('hidden'); }
function closeCatalog() { document.getElementById('catalog-modal').classList.add('hidden'); }
function pickTool(type) { selectTool(type, null); closeCatalog(); }

// ── Tastatur ──────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
    spaceDown = true;
    wrapEl().classList.add('pan-mode');
    e.preventDefault();
    return;
  }
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'r' || e.key === 'R') rotateSelected();
  if (e.key === 'f' || e.key === 'F') fitToContent();
  if (e.key === 'Delete') deleteSelected();
  if (e.key === 'Escape') selectElement(null);
});

document.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceDown = false;
    if (currentTool !== 'pan') wrapEl().classList.remove('pan-mode');
  }
});

// ── WebSocket Updates ─────────────────────────

window.onStateUpdate = function(state) {
  if (state.type === 'turnout_info') {
    turnoutStates[state.address] = state.thrown;
    renderAll();
    const el = document.getElementById(`turnout-state-${state.address}`);
    if (el) el.innerHTML = `Status: <strong>${state.thrown ? 'Abbiegen' : 'Gerade'}</strong>`;
  }
};

// ── Init ──────────────────────────────────────

(function initCanvas() {
  const s = svgEl();
  s.addEventListener('wheel', onWheel, { passive: false });
  s.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  s.addEventListener('click', onCanvasClick);
  s.addEventListener('contextmenu', onCanvasRightClick);
  window.addEventListener('resize', () => applyView());
  applyView();
})();

loadTrack();
</script>
