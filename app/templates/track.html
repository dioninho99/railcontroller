{% extends "base.html" %}
{% block title %}– Gleisplan{% endblock %}
{% block nav_track %}active{% endblock %}

{% block content %}
<style>
  /* Gleisplan-spezifische Optimierungen (nur auf dieser Seite) */
  :root {
    --canvas-bg:   #f8f6ff;
    --grid-line:   #e0d8fb;
    --grid-major:  #cebff8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas-bg:  #0f0d1a;
      --grid-line:  #211c33;
      --grid-major: #2c2547;
    }
  }

  .track-workspace {
    height: calc(100vh - 168px);
    min-height: 480px;
  }

  .track-canvas-wrap {
    position: relative;
    overflow: hidden;               /* Navigation läuft über viewBox, nicht Scrollbars */
    background: var(--canvas-bg);
    cursor: crosshair;
  }
  .track-canvas-wrap.pan-mode { cursor: grab; }
  .track-canvas-wrap.panning  { cursor: grabbing; }

  #track-canvas {
    display: block;
    width: 100%;
    height: 100%;
    min-width: 0;                   /* alte min-width:800px überschreiben */
  }

  /* Schwebende Navigations-Steuerung unten rechts auf der Leinwand */
  .canvas-nav {
    position: absolute;
    right: .75rem;
    bottom: .75rem;
    display: flex;
    align-items: center;
    gap: .25rem;
    padding: .3rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(30,27,46,.18);
  }
  .canvas-nav button {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px;
    background: transparent; color: var(--text);
    font-size: 1rem; cursor: pointer;
    transition: background .12s;
  }
  .canvas-nav button:hover { background: var(--primary-light); color: var(--primary); }
  .canvas-nav .zoom-label {
    min-width: 46px; text-align: center;
    font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--text-muted); user-select: none;
  }
  .canvas-nav .nav-sep { width: 1px; height: 20px; background: var(--border); margin: 0 .15rem; }

  /* Element-Zähler / leerer Zustand oben links */
  .canvas-hint {
    position: absolute;
    left: .75rem; top: .75rem;
    font-size: 12px; color: var(--text-muted);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: .3rem .6rem;
    pointer-events: none;
    max-width: 240px;
  }
  .canvas-hint strong { color: var(--primary); }

  .zoom-tool { font-weight: 700; }
</style>

<div class="page-header">
  <h1>Gleisplan</h1>
  <div class="track-toolbar">
    <span class="toolbar-label">Element:</span>
    <button class="tool-btn active" data-type="straight" onclick="selectTool('straight', this)" title="Gerades Gleis">━</button>
    <button class="tool-btn" data-type="curve" onclick="selectTool('curve', this)" title="Kurve">╭</button>
    <button class="tool-btn" data-type="turnout" onclick="selectTool('turnout', this)" title="Weiche">⑂</button>
    <button class="tool-btn" data-type="signal" onclick="selectTool('signal', this)" title="Signal">🚦</button>
    <button class="tool-btn" data-type="block" onclick="selectTool('block', this)" title="Block">▭</button>
    <button class="tool-btn" data-type="label" onclick="selectTool('label', this)" title="Beschriftung">T</button>
    <span class="toolbar-sep"></span>
    <button class="tool-btn" data-type="pan" onclick="selectTool('pan', this)" title="Verschieben (Leertaste halten + ziehen)">✋</button>
    <span class="toolbar-sep"></span>
    <button class="tool-btn" onclick="rotateSelected()" title="Drehen (R)">↻</button>
    <button class="tool-btn" onclick="deleteSelected()" title="Löschen (Entf)">🗑</button>
    <span class="toolbar-sep"></span>
    <button class="btn btn-sm btn-ghost" onclick="clearTrack()">Leeren</button>
  </div>
</div>

<div class="track-workspace">
  <div class="track-canvas-wrap">
    <svg id="track-canvas" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 2000 1300" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--grid-line)" stroke-width="1"/>
        </pattern>
        <pattern id="grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
          <rect width="200" height="200" fill="url(#grid)"/>
          <path d="M 200 0 L 0 0 0 200" fill="none" stroke="var(--grid-major)" stroke-width="1.5"/>
        </pattern>
      </defs>
      <rect id="backdrop" x="-6000" y="-6000" width="16000" height="16000" fill="var(--canvas-bg)"/>
      <rect id="gridrect" x="-6000" y="-6000" width="16000" height="16000" fill="url(#grid-major)"/>
      <g id="track-elements"></g>
    </svg>

    <div class="canvas-hint" id="canvas-hint"></div>

    <div class="canvas-nav">
      <button onclick="zoomBy(1/1.25)" title="Verkleinern">−</button>
      <span class="zoom-label" id="zoom-label">100 %</span>
      <button onclick="zoomBy(1.25)" title="Vergrößern">+</button>
      <span class="nav-sep"></span>
      <button onclick="fitToContent()" title="Einpassen (F)">⤢</button>
    </div>
  </div>

  <!-- Eigenschaften-Panel -->
  <div class="track-props">
    <div class="props-header">Eigenschaften</div>
    <div id="props-content">
      <p class="muted" style="padding:.75rem">Element anklicken zum Bearbeiten.</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const GRID = 40;
const MIN_VIEW_W = 400;     // stärkste Vergrößerung
const MAX_VIEW_W = 8000;    // stärkste Verkleinerung
const DEFAULT_VIEW = { x: 0, y: 0, w: 2000, h: 1300 };

let currentTool = 'straight';
let selectedId  = null;
let elements    = [];
let turnoutStates = {};

let view = { ...DEFAULT_VIEW };

// Pan-/Drag-Zustand
let isPanning = false;
let spaceDown = false;
let dragStart = null;
let movedWhilePanning = false;

const svgEl  = () => document.getElementById('track-canvas');
const wrapEl = () => document.querySelector('.track-canvas-wrap');

// ── Ansicht (viewBox) ─────────────────────────

function applyView() {
  const s = svgEl();
  s.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  const scale = (s.clientWidth || 1) / view.w;
  const label = document.getElementById('zoom-label');
  if (label) label.textContent = Math.round(scale * 100) + ' %';
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function screenToWorld(clientX, clientY) {
  const s = svgEl();
  const pt = s.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(s.getScreenCTM().inverse());
}

function zoomAt(clientX, clientY, factor) {
  const world = screenToWorld(clientX, clientY);
  const newW  = clamp(view.w / factor, MIN_VIEW_W, MAX_VIEW_W);
  const ratio = newW / view.w;
  view.x = world.x - (world.x - view.x) * ratio;
  view.y = world.y - (world.y - view.y) * ratio;
  view.w = newW;
  view.h = view.h * ratio;
  applyView();
}

function zoomBy(factor) {
  const r = wrapEl().getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor);
}

function fitToContent() {
  const s = svgEl();
  const cw = s.clientWidth  || 1000;
  const ch = s.clientHeight || 600;
  const ar = cw / ch;

  if (elements.length === 0) {
    view = { x: 0, y: 0, w: DEFAULT_VIEW.h * ar, h: DEFAULT_VIEW.h };
    applyView();
    return;
  }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const el of elements) {
    minX = Math.min(minX, el.x);
    minY = Math.min(minY, el.y);
    maxX = Math.max(maxX, el.x + GRID);
    maxY = Math.max(maxY, el.y + GRID);
  }
  const pad = GRID * 2;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;

  const boxW = maxX - minX, boxH = maxY - minY;
  let w, h;
  if (boxW / boxH > ar) { w = boxW; h = boxW / ar; }
  else                  { h = boxH; w = boxH * ar; }

  view = { x: minX - (w - boxW) / 2, y: minY - (h - boxH) / 2, w, h };
  applyView();
}

function updateHint() {
  const hint = document.getElementById('canvas-hint');
  if (!hint) return;
  if (elements.length === 0) {
    hint.innerHTML = 'Leer. Werkzeug wählen und auf die Leinwand klicken.';
  } else {
    hint.innerHTML = `<strong>${elements.length}</strong> Elemente · Scrollen = Zoom · Leertaste + ziehen = verschieben`;
  }
}

// ── Laden ─────────────────────────────────────

async function loadTrack() {
  elements = await fetch('/api/track/').then(r => r.json());
  const turnouts = await fetch('/api/turnouts/').then(r => r.json());
  turnouts.forEach(t => { turnoutStates[t.address] = t.thrown; });
  renderAll();
  updateHint();
  fitToContent();   // beim Öffnen automatisch auf den Plan einpassen
}

// ── Rendern ───────────────────────────────────

function renderAll() {
  const g = document.getElementById('track-elements');
  g.innerHTML = '';
  elements.forEach(el => g.appendChild(makeElement(el)));
}

function makeElement(el) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `translate(${el.x + GRID/2}, ${el.y + GRID/2}) rotate(${el.rotation})`);
  g.setAttribute('data-id', el.id);
  g.setAttribute('cursor', 'pointer');

  if (selectedId === el.id) {
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', -GRID/2 - 4); bg.setAttribute('y', -GRID/2 - 4);
    bg.setAttribute('width', GRID + 8); bg.setAttribute('height', GRID + 8);
    bg.setAttribute('rx', '6');
    bg.setAttribute('fill', '#7c3aed'); bg.setAttribute('fill-opacity', '0.15');
    bg.setAttribute('stroke', '#7c3aed'); bg.setAttribute('stroke-width', '1.5');
    bg.setAttribute('stroke-dasharray', '4 2');
    g.appendChild(bg);
  }

  g.innerHTML += getElementSVG(el);
  g.addEventListener('click', (e) => { e.stopPropagation(); selectElement(el.id); });
  return g;
}

function getElementSVG(el) {
  const t = el.element_type;
  const hs = GRID / 2;

  if (t === 'straight') {
    return `
      <rect x="${-hs}" y="-8" width="${GRID}" height="16" rx="3" fill="#e8e0fc" fill-opacity="0.6"/>
      <line x1="${-hs}" y1="0" x2="${hs}" y2="0" stroke="#3b1fa8" stroke-width="5" stroke-linecap="butt"/>
      <line x1="${-hs}" y1="0" x2="${hs}" y2="0" stroke="#c4b0fa" stroke-width="2" stroke-linecap="butt"/>`;
  }
  if (t === 'curve') {
    return `
      <rect x="${-hs}" y="${-hs}" width="${GRID}" height="${GRID}" rx="3" fill="#e8e0fc" fill-opacity="0.4"/>
      <path d="M ${-hs} 0 Q 0 0 0 ${-hs}" fill="none" stroke="#3b1fa8" stroke-width="5" stroke-linecap="butt"/>
      <path d="M ${-hs} 0 Q 0 0 0 ${-hs}" fill="none" stroke="#c4b0fa" stroke-width="2" stroke-linecap="butt"/>`;
  }
  if (t === 'turnout') {
    const thrown = turnoutStates[el.ref_address] || false;
    const straightColor = thrown ? '#888' : '#d97706';
    const thrownColor   = thrown ? '#d97706' : '#888';
    const addr = el.ref_address
      ? `<rect x="-11" y="${hs-18}" width="22" height="14" rx="3" fill="#1e1b2e" fill-opacity="0.7"/>
         <text x="0" y="${hs-8}" text-anchor="middle" font-size="9" font-weight="700" fill="#fbbf24">${el.ref_address}</text>`
      : `<rect x="-14" y="${hs-18}" width="28" height="14" rx="3" fill="#ef4444" fill-opacity="0.8"/>
         <text x="0" y="${hs-8}" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">kein Adr.</text>`;
    return `
      <rect x="${-hs}" y="${-hs}" width="${GRID}" height="${GRID}" rx="3" fill="#fef9c3" fill-opacity="0.5"/>
      <line x1="${-hs}" y1="0" x2="${hs}" y2="0" stroke="${straightColor}" stroke-width="5" stroke-linecap="butt"/>
      <line x1="${-hs}" y1="0" x2="4" y2="${-hs+4}" stroke="${thrownColor}" stroke-width="4" stroke-linecap="round"/>
      ${addr}`;
  }
  if (t === 'signal') {
    return `
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.5"/>
      <circle cx="0" cy="-3" r="4" fill="#22c55e"/>
      <circle cx="0" cy="5" r="4" fill="#374151"/>
      <line x1="0" y1="12" x2="0" y2="${hs-2}" stroke="#555" stroke-width="2"/>
      ${el.ref_address ? `<text x="0" y="${hs+10}" text-anchor="middle" font-size="9" font-weight="700" fill="#7c3aed">${el.ref_address}</text>` : ''}`;
  }
  if (t === 'block') {
    const lbl = el.label || 'Block';
    return `
      <rect x="${-hs+2}" y="-10" width="${GRID-4}" height="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="4"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" font-weight="700" fill="#4c1d95">${lbl}</text>`;
  }
  if (t === 'label') {
    return `
      <rect x="${-(el.label||'Text').length * 4}" y="-11" width="${(el.label||'Text').length * 8 + 8}" height="16" rx="3" fill="#fff" fill-opacity="0.8"/>
      <text x="0" y="4" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b2e">${el.label || 'Text'}</text>`;
  }
  return `<rect x="${-hs}" y="${-hs}" width="${GRID}" height="${GRID}" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" rx="4"/>
          <text x="0" y="4" text-anchor="middle" font-size="9" fill="#374151">${t}</text>`;
}

// ── Navigation: Zoom (Rad) + Pan (Leertaste/Mitteltaste/Pan-Werkzeug) ──

function onWheel(e) {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  zoomAt(e.clientX, e.clientY, factor);
}

function onPointerDown(e) {
  const wantPan = (e.button === 1) || spaceDown || currentTool === 'pan';
  if (wantPan && e.button !== 2) {
    isPanning = true;
    movedWhilePanning = false;
    dragStart = { x: e.clientX, y: e.clientY };
    wrapEl().classList.add('panning');
    e.preventDefault();
  }
}

function onPointerMove(e) {
  if (!isPanning) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) movedWhilePanning = true;
  const s = svgEl();
  view.x -= dx * (view.w / (s.clientWidth  || 1));
  view.y -= dy * (view.h / (s.clientHeight || 1));
  dragStart = { x: e.clientX, y: e.clientY };
  applyView();
}

function onPointerUp() {
  if (isPanning) {
    isPanning = false;
    wrapEl().classList.remove('panning');
  }
}

// ── Klick auf Leinwand → Element setzen ───────

function onCanvasClick(e) {
  if (currentTool === 'pan' || spaceDown) return;
  if (movedWhilePanning) { movedWhilePanning = false; return; }
  if (e.target.closest('[data-id]')) return;   // Element angeklickt → Selektion
  selectElement(null);
  const w = screenToWorld(e.clientX, e.clientY);
  const x = Math.floor(w.x / GRID) * GRID;
  const y = Math.floor(w.y / GRID) * GRID;
  placeElement(currentTool, x, y);
}

function onCanvasRightClick(e) {
  e.preventDefault();
  rotateSelected();
}

async function placeElement(type, x, y) {
  const label = type === 'label' ? (prompt('Beschriftung:', '') || 'Text') : '';
  let ref_address = null;
  if (type === 'turnout' || type === 'signal') {
    const inp = prompt(`DCC-Adresse für ${type === 'turnout' ? 'Weiche' : 'Signal'} (1–2044):`, '1');
    ref_address = inp ? parseInt(inp) || null : null;
  }
  const res = await fetch('/api/track/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({element_type: type, x, y, rotation: 0, ref_address, label})
  });
  const el = await res.json();
  elements.push(el);
  renderAll();
  updateHint();
  selectElement(el.id);
}

// ── Selektion & Properties ────────────────────

function selectElement(id) {
  selectedId = id;
  renderAll();
  showProps(id);
}

function showProps(id) {
  const el = elements.find(e => e.id === id);
  const panel = document.getElementById('props-content');
  if (!el) {
    panel.innerHTML = '<p class="muted" style="padding:.75rem">Element anklicken zum Bearbeiten.</p>';
    return;
  }

  const typeLabels = {straight:'Gerades Gleis', curve:'Kurve', turnout:'Weiche', signal:'Signal', block:'Block', label:'Beschriftung'};

  panel.innerHTML = `
    <div class="prop-section">
      <div class="prop-type-badge">${typeLabels[el.element_type] || el.element_type}</div>

      <div class="prop-row">
        <span class="prop-label">Rotation</span>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          ${[0,45,90,135,180,225,270,315].map(r =>
            `<button class="rot-btn ${el.rotation===r?'rot-active':''}" onclick="setRotation(${el.id},${r})">${r}°</button>`
          ).join('')}
        </div>
      </div>

      ${el.element_type === 'turnout' || el.element_type === 'signal' ? `
      <div class="prop-row">
        <span class="prop-label">DCC-Adresse</span>
        <div style="display:flex;gap:.4rem;align-items:center">
          <input type="number" id="prop-addr-${el.id}" value="${el.ref_address || ''}"
                 min="1" max="2044" placeholder="1–2044"
                 style="width:90px">
          <button class="btn btn-sm btn-primary" onclick="saveAddr(${el.id})">Speichern</button>
        </div>
      </div>` : ''}

      ${el.element_type === 'block' || el.element_type === 'label' ? `
      <div class="prop-row">
        <span class="prop-label">Beschriftung</span>
        <div style="display:flex;gap:.4rem;align-items:center">
          <input type="text" id="prop-label-${el.id}" value="${el.label || ''}" placeholder="Text">
          <button class="btn btn-sm btn-primary" onclick="saveLabel(${el.id})">OK</button>
        </div>
      </div>` : ''}

      <div class="prop-actions">
        <button class="btn btn-sm btn-ghost" onclick="rotateSelected()">↻ Drehen</button>
        <button class="btn btn-sm btn-danger" onclick="deleteSelected()">Löschen</button>
      </div>
    </div>

    ${el.element_type === 'turnout' && el.ref_address ? `
    <div class="prop-section" style="border-top:1px solid var(--border)">
      <div class="prop-label" style="margin-bottom:.6rem">Weiche ${el.ref_address} stellen</div>
      <div style="display:flex;gap:.5rem">
        <button class="btn btn-success" style="flex:1" onclick="controlTurnout(${el.ref_address},false)">━ Gerade</button>
        <button class="btn btn-warning" style="flex:1" onclick="controlTurnout(${el.ref_address},true)">⑂ Abbiegen</button>
      </div>
      <div class="prop-turnout-state" id="turnout-state-${el.ref_address}">
        Status: <strong>${turnoutStates[el.ref_address] ? 'Abbiegen' : 'Gerade'}</strong>
      </div>
    </div>` : ''}
  `;
}

async function setRotation(id, rotation) {
  const el = elements.find(e => e.id === id);
  if (!el) return;
  el.rotation = rotation;
  await fetch(`/api/track/${id}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({rotation})
  });
  renderAll(); showProps(id);
}

async function saveAddr(id) {
  const inp = document.getElementById(`prop-addr-${id}`);
  const value = parseInt(inp.value) || null;
  await updateProp(id, 'ref_address', value);
}

async function saveLabel(id) {
  const inp = document.getElementById(`prop-label-${id}`);
  await updateProp(id, 'label', inp.value);
}

async function updateProp(id, key, value) {
  const el = elements.find(e => e.id === id);
  if (!el) return;
  el[key] = value;
  await fetch(`/api/track/${id}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({[key]: value})
  });
  renderAll(); showProps(id);
}

// ── Aktionen ──────────────────────────────────

async function rotateSelected() {
  if (!selectedId) return;
  const el = elements.find(e => e.id === selectedId);
  if (!el) return;
  el.rotation = (el.rotation + 45) % 360;
  await fetch(`/api/track/${selectedId}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({rotation: el.rotation})
  });
  renderAll(); showProps(selectedId);
}

async function deleteSelected() {
  if (!selectedId) return;
  if (!confirm('Element löschen?')) return;
  await fetch(`/api/track/${selectedId}`, {method:'DELETE'});
  elements = elements.filter(e => e.id !== selectedId);
  selectedId = null;
  renderAll(); showProps(null); updateHint();
}

async function clearTrack() {
  if (!confirm('Gesamten Gleisplan löschen?')) return;
  await fetch('/api/track/', {method:'DELETE'});
  elements = []; renderAll(); showProps(null); updateHint();
}

async function controlTurnout(address, thrown) {
  await fetch(`/api/turnouts/${address}/set`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({thrown})
  });
}

function selectTool(type, btn) {
  currentTool = type;
  document.querySelectorAll('.tool-btn[data-type]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  wrapEl().classList.toggle('pan-mode', type === 'pan');
}

// ── Tastatur ──────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
    spaceDown = true;
    wrapEl().classList.add('pan-mode');
    e.preventDefault();
    return;
  }
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'r' || e.key === 'R') rotateSelected();
  if (e.key === 'f' || e.key === 'F') fitToContent();
  if (e.key === 'Delete') deleteSelected();
  if (e.key === 'Escape') selectElement(null);
});

document.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceDown = false;
    if (currentTool !== 'pan') wrapEl().classList.remove('pan-mode');
  }
});

// ── WebSocket Updates ─────────────────────────

window.onStateUpdate = function(state) {
  if (state.type === 'turnout_info') {
    turnoutStates[state.address] = state.thrown;
    renderAll();
    const el = document.getElementById(`turnout-state-${state.address}`);
    if (el) el.innerHTML = `Status: <strong>${state.thrown ? 'Abbiegen' : 'Gerade'}</strong>`;
  }
};

// ── Init ──────────────────────────────────────

(function initCanvas() {
  const s = svgEl();
  s.addEventListener('wheel', onWheel, { passive: false });
  s.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  s.addEventListener('click', onCanvasClick);
  s.addEventListener('contextmenu', onCanvasRightClick);
  window.addEventListener('resize', () => applyView());
  applyView();
})();

loadTrack();
</script>
